<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poodle — claims desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F4C39A'/%3E%3Ccircle cx='16' cy='8' r='5' fill='%23E3A57A'/%3E%3Ccircle cx='12' cy='15' r='2' fill='%232C2420'/%3E%3Ccircle cx='20' cy='15' r='2' fill='%232C2420'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Executive claims desk.
       Palette from ui-ux-pro-max (insurance / trust): #0369A1, #0EA5E9, #22C55E, #F0F9FF, #0C4A6E.
       Fira Sans for reading. Fira Code for ids and times. */
    :root {
      --ink: #0C4A6E;
      --muted: #475569;
      --line: #E2E8F0;
      --sky: #F0F9FF;
      --blue: #0369A1;
      --blue-2: #0EA5E9;
      --card: #ffffff;
      --green: #166534;
      --green-bg: #DCFCE7;
      --amber: #92400E;
      --amber-bg: #FEF3C7;
      --red: #991B1B;
      --red-bg: #FEE2E2;
      --refer: #075985;
      --refer-bg: #E0F2FE;
      --shadow: 0 16px 40px rgba(12, 74, 110, 0.08);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sky);
      color: var(--ink);
      font-family: "Fira Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    button, input { font: inherit; color: inherit; }
    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      background: var(--ink);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 5;
    }
    .skip:focus { top: 12px; }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 136px 0 48px;
    }

    .desk {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .perch {
      position: absolute;
      z-index: 2;
      left: 22px;
      bottom: calc(100% - 16px);
      width: 168px;
      height: 150px;
      pointer-events: none;
    }
    .poodle { width: 100%; height: 100%; overflow: visible; display: block; }
    .fur { fill: #F4C39A; }
    .fur-deep { fill: #E3A57A; }
    .fur-lite { fill: #FFF3E8; }
    .face { fill: #FFE8D6; }
    .nose { fill: #3D2C28; }
    .pupil { fill: #2C2420; }
    .catch { fill: #fff; }
    .cheek { fill: #F3B2A3; }
    .shadow { fill: rgba(12, 74, 110, 0.14); }
    .bow { fill: #0EA5E9; }
    .bow-knot { fill: #0369A1; }
    .collar { fill: none; stroke: #0369A1; stroke-width: 3.5; stroke-linecap: round; }
    .tag { fill: #E0F2FE; stroke: #0369A1; stroke-width: 1.4; }
    .tag-letter { fill: #0369A1; font-family: "Fira Sans", sans-serif; font-size: 9px; font-weight: 700; }
    .mouth { fill: none; stroke: #8A5A48; stroke-width: 1.6; stroke-linecap: round; }
    .curl { fill: none; stroke: #E3A57A; stroke-width: 1.6; stroke-linecap: round; opacity: 0.85; }

    .torso, .head, .tail, .ear, .eyes-open {
      transform-box: fill-box;
    }
    .torso { transform-origin: center bottom; animation: breathe 3.8s ease-in-out infinite; }
    .tail { transform-origin: 90% 65%; animation: wag 1.15s ease-in-out infinite; }
    .ear { transform-origin: center top; animation: ear 2.8s ease-in-out infinite; }
    .ear-r { animation-delay: -0.6s; }
    .head { transform-origin: center 80%; }
    .eyes-open { transform-origin: center; animation: blink 5.2s infinite; }
    .eyes-happy { display: none; }
    .mouth-happy { display: none; }

    .poodle.mood-watch .head { animation: look 3.6s ease-in-out infinite; }
    .poodle.mood-alert .head { animation: perk 2.2s ease-in-out infinite; }
    .poodle.mood-alert .tail { animation-duration: 0.42s; }
    .poodle.mood-happy .tail { animation-duration: 0.55s; }
    .poodle.mood-happy .eyes-open { display: none; }
    .poodle.mood-happy .eyes-happy { display: block; }
    .poodle.mood-happy .mouth-rest { display: none; }
    .poodle.mood-happy .mouth-happy { display: block; }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(16deg); }
    }
    @keyframes ear {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }
    @keyframes blink {
      0%, 7%, 100% { transform: scaleY(1); }
      9%, 11% { transform: scaleY(0.08); }
    }
    @keyframes look {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes perk {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .torso, .head, .tail, .ear, .eyes-open { animation: none; }
    }

    .desk-head {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px 16px;
      align-items: end;
      min-height: 84px;
      padding: 16px 16px 14px 148px;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .mood {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    .how {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 28ch;
    }

    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 16px;
    }
    .kpi {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
    }
    .kpi b {
      display: block;
      font-family: "Fira Code", ui-monospace, monospace;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    .kpi span { color: var(--muted); font-size: 13px; }
    .kpi.flag { border-left: 4px solid #F59E0B; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 14px;
    }
    .chip, .row, .clip {
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      transition: background-color 180ms ease, border-color 180ms ease;
    }
    .chip {
      padding: 6px 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .chip:hover, .row:hover, .clip:hover { border-color: #7DD3FC; background: var(--sky); }
    .chip[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .chip:focus-visible, .row:focus-visible, .clip:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .workspace { border-top: 1px solid var(--line); }
    .queue, .story, .proof { padding: 16px; }
    .queue h2, .story h2, .proof h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      width: 100%;
      text-align: left;
      border-radius: 12px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 8px;
    }
    .row[aria-pressed="true"] {
      background: var(--sky);
      border-color: #7DD3FC;
      box-shadow: inset 3px 0 0 var(--blue);
    }
    .row .id {
      font-family: "Fira Code", ui-monospace, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .row .place { grid-column: 1; color: var(--muted); font-size: 13px; }
    .empty { margin: 0; color: var(--muted); }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }
    .pill.accept { background: var(--green-bg); color: var(--green); }
    .pill.partial { background: var(--amber-bg); color: var(--amber); }
    .pill.reject { background: var(--red-bg); color: var(--red); }
    .pill.refer { background: var(--refer-bg); color: var(--refer); }

    .sentence {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .meta strong { color: var(--ink); font-weight: 600; }
    .said {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-left: 3px solid var(--blue-2);
      background: var(--sky);
      border-radius: 0 10px 10px 0;
      color: var(--ink);
    }
    .said span { display: block; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }

    .split { display: grid; gap: 12px; margin-bottom: 18px; }
    .bucket h3 {
      margin: 0 0 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bucket ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .bucket li { font-size: 14px; }
    .bucket li strong { display: block; }
    .bucket.yes h3 { color: var(--green); }
    .bucket.no h3 { color: var(--red); }
    .bucket svg { flex: 0 0 auto; }

    .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
    .event {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px;
      padding: 8px;
      border-radius: 10px;
    }
    .event.is-on { background: var(--sky); }
    .event time {
      font-family: "Fira Code", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
    }
    .event p { margin: 0; font-size: 14px; }
    .event .cam { color: var(--muted); font-size: 12px; }

    .clips { display: flex; flex-direction: column; gap: 8px; }
    .clip {
      text-align: left;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .clip[aria-pressed="true"] { background: var(--sky); border-color: #7DD3FC; }
    .clip .cam {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Fira Code", ui-monospace, monospace;
      font-size: 12px;
      color: var(--blue);
      margin-bottom: 4px;
    }
    .clip p { margin: 0; font-size: 14px; }
    .signoff {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--sky);
      color: var(--ink);
      font-size: 14px;
    }
    .note {
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 720px) {
      .page { width: min(1120px, calc(100% - 48px)); padding-top: 172px; }
      .desk-head {
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 18px 22px 16px 210px;
        min-height: 92px;
      }
      .kpis { grid-template-columns: repeat(4, 1fr); padding: 16px 22px 8px; }
      .filters { padding: 0 22px 16px; }
      .split { grid-template-columns: 1fr 1fr; }
      .how { text-align: right; }
    }

    @media (min-width: 1024px) {
      .workspace {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 280px;
      }
      .queue { border-right: 1px solid var(--line); }
      .proof { border-left: 1px solid var(--line); }
      .story { padding: 20px 22px 28px; }
    }

    @media (max-width: 719px) {
      .perch { width: 126px; height: 114px; left: 10px; bottom: calc(100% - 12px); }
      .sentence { font-size: 20px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#story">Skip to the open claim</a>
  <div class="page">
    <article class="desk">
      <div class="perch" aria-hidden="true">

            <g class="tail">
              <circle class="fur" cx="40" cy="124" r="11"/>

            </g>
            <ellipse class="fur" cx="84" cy="126" rx="38" ry="28"/>
            <circle class="fur" cx="62" cy="120" r="16"/>

          </g>
        </svg>
      </div>

      <header class="desk-head">
        <div>
          <p class="kicker">Claims desk</p>
          <h1>Poodle</h1>
          <p class="mood" id="mood" role="status">Watching this claim</p>
        </div>
        <p class="how">Pick a claim. Read the decision. Check the clips.</p>
      </header>

      <section class="kpis" aria-label="Desk summary">
        <div class="kpi"><b id="kpi-open">4</b><span>Open claims</span></div>
        <div class="kpi"><b id="kpi-person">3</b><span>Needs a person</span></div>
        <div class="kpi"><b id="kpi-ready">1</b><span>Ready to settle</span></div>
        <div class="kpi flag"><b id="kpi-fraud">1</b><span>Fraud flag</span></div>
      </section>

      <div class="filters" role="group" aria-label="Filter claims">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="person" aria-pressed="false">Needs a person</button>
        <button type="button" class="chip" data-filter="ready" aria-pressed="false">Ready to settle</button>
      </div>

      <div class="workspace">
        <section class="queue" aria-labelledby="queue-label">
          <h2 id="queue-label">Claims</h2>
          <div class="rows" id="rows"></div>
        </section>
        <section class="story" id="story" aria-labelledby="story-label">
          <h2 id="story-label">Decision</h2>
          <div id="story-body"></div>
        </section>
        <aside class="proof" aria-labelledby="proof-label">
          <h2 id="proof-label">Clips</h2>
          <div id="proof-body"></div>
        </aside>
      </div>
    </article>
    <p class="note">Sample claims for the demo. Footage is not live on this page.</p>
  </div>

  <script>
    const claims = [
      {
        id: "PD-0147",

      {

        ],

      },
      {
        id: "PD-0188",
        place: "High street",
        when: "16 Oct 2026, 18:20",
        outcome: "refer",
        label: "Refer",
        needsPerson: true,
        fraud: true,
        mood: "alert",
        moodLine: "Waiting for a person",
        sentence: "The brake comes before any hazard in frame. Poodle will not decide this, and it is not an accusation. A person should review it.",

        policy: "Comprehensive",

        events: [
          { t: "00:04.0", cam: "Dashcam", text: "The car ahead brakes hard.", conf: "93%" },

          { t: "00:05.0", cam: "Dashcam", text: "The claimant hits the car ahead.", conf: "96%" }
        ],
        clips: [
          { cam: "Dashcam", t: "00:04.0", text: "Hard brake, then the shunt." },
          { cam: "Dashcam", t: "00:04.2", text: "The road ahead of the lead car looks clear." }
        ],
        signoff: "Fraud flag for a handler. Poodle does not accuse the customer."
      },
      {
        id: "PD-0162",
        place: "Car park",
        when: "17 Oct 2026, 08:15",
        outcome: "accept",
        label: "Accept",
        needsPerson: false,
        fraud: false,
        mood: "happy",
        moodLine: "Ready to settle",
        sentence: "Covered. No exclusion. Low fraud score. The repair is under the auto-settle limit.",
        statement: "A trolley rolled into the door while I was in the shop.",
        policy: "Comprehensive",
        excess: "£200 excess",
        fault: "Not at fault",
        covered: [
          ["Door repair", "Section 1. Estimate £640, minus the £200 excess."]
        ],
        uncovered: [],
        events: [
          { t: "00:02.4", cam: "Store camera", text: "A trolley rolls off the rank.", conf: "92%" },
          { t: "00:03.1", cam: "Store camera", text: "It hits the parked car's door.", conf: "97%" }
        ],
        clips: [
          { cam: "Store camera", t: "00:02.4", text: "The trolley leaves the rank." },
          { cam: "Store camera", t: "00:03.1", text: "Impact on the door." }
        ],
        signoff: "High confidence and low value. This one can settle without a handler."
      }
    ];

    const state = { filter: "all", id: "PD-0147", clip: 0 };

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function icon(name) {
      const paths = {
        check: '<path d="M5 12l5 5L20 7"/>',
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
        film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>'
      };
      return `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
    }

    function visible() {
      return claims.filter((claim) => {
        if (state.filter === "person") return claim.needsPerson;
        if (state.filter === "ready") return claim.outcome === "accept";
        return true;
      });
    }

    function selected() {
      return claims.find((claim) => claim.id === state.id) || visible()[0] || claims[0];
    }

    function paintSummary() {
      document.getElementById("kpi-open").textContent = String(claims.length);
      document.getElementById("kpi-person").textContent = String(claims.filter((c) => c.needsPerson).length);
      document.getElementById("kpi-ready").textContent = String(claims.filter((c) => c.outcome === "accept").length);
      document.getElementById("kpi-fraud").textContent = String(claims.filter((c) => c.fraud).length);
    }

    function paintQueue() {
      const list = visible();
      const root = document.getElementById("rows");
      if (!list.length) {
        root.innerHTML = '<p class="empty">No claims in this group.</p>';
        return;
      }
      if (!list.some((claim) => claim.id === state.id)) {
        state.id = list[0].id;
        state.clip = 0;
      }
      root.innerHTML = list.map((claim) => `
        <button type="button" class="row" data-id="${esc(claim.id)}" aria-pressed="${claim.id === state.id ? "true" : "false"}">
          <span class="id">${esc(claim.id)}</span>
          <span class="pill ${esc(claim.outcome)}">${esc(claim.label)}</span>
          <span class="place">${esc(claim.place)}</span>
        </button>
      `).join("");
      root.querySelectorAll(".row").forEach((button) => {
        button.addEventListener("click", () => {
          state.id = button.dataset.id;
          state.clip = 0;
          paint();
        });
      });
    }

    function paintStory() {
      const claim = selected();
      const poodle = document.getElementById("poodle");
      poodle.classList.remove("mood-watch", "mood-alert", "mood-happy");
      poodle.classList.add("mood-" + claim.mood);
      document.getElementById("mood").textContent = claim.moodLine;

      const covered = claim.covered.length
        ? claim.covered.map(([name, detail]) => `<li><strong>${esc(name)}</strong> ${esc(detail)}</li>`).join("")
        : "<li>Held for a person.</li>";
      const uncoveredEmpty = claim.outcome === "accept" ? "No exclusion on this claim." : "Not ruled out.";
      const uncovered = claim.uncovered.length
        ? claim.uncovered.map(([name, detail]) => `<li><strong>${esc(name)}</strong> ${esc(detail)}</li>`).join("")
        : `<li>${esc(uncoveredEmpty)}</li>`;
      const activeTime = claim.clips[state.clip] ? claim.clips[state.clip].t : "";
      const events = claim.events.map((event) => `
        <li class="event${event.t === activeTime ? " is-on" : ""}">
          <time>${esc(event.t)}</time>
          <div>
            <p>${esc(event.text)}</p>
            <div class="cam">${esc(event.cam)} · ${esc(event.conf)}</div>
          </div>
        </li>
      `).join("");

      document.getElementById("story-body").innerHTML = `
        <p class="sentence">${esc(claim.sentence)}</p>
        <p class="meta">
          <span class="pill ${esc(claim.outcome)}">${esc(claim.label)}</span>
          <span><strong>${esc(claim.fault)}</strong></span>
          <span>${esc(claim.policy)} · ${esc(claim.excess)}</span>
          <span>${esc(claim.when)}</span>
        </p>
        <blockquote class="said"><span>Customer</span>${esc(claim.statement)}</blockquote>
        <div class="split">
          <div class="bucket yes">
            <h3>${icon("check")} Covered</h3>
            <ul>${covered}</ul>
          </div>
          <div class="bucket no">
            <h3>${icon("x")} Not covered</h3>
            <ul>${uncovered}</ul>
          </div>
        </div>
        <h2>What the footage shows</h2>
        <ol class="timeline">${events}</ol>
      `;
    }

    function paintProof() {
      const claim = selected();
      const clips = claim.clips.map((clip, index) => `
        <button type="button" class="clip" data-clip="${index}" aria-pressed="${index === state.clip ? "true" : "false"}">
          <span class="cam">${icon("film")} ${esc(clip.cam)} · ${esc(clip.t)}</span>
          <p>${esc(clip.text)}</p>
        </button>
      `).join("");
      document.getElementById("proof-body").innerHTML = `
        <div class="clips">${clips}</div>
        <p class="signoff">${icon("shield")} ${esc(claim.signoff)}</p>
      `;
      document.getElementById("proof-body").querySelectorAll(".clip").forEach((button) => {
        button.addEventListener("click", () => {
          state.clip = Number(button.dataset.clip);
          paintStory();
          paintProof();
        });
      });
    }

    function paint() {
      paintQueue();
      paintStory();
      paintProof();
    }

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        state.filter = chip.dataset.filter;
        document.querySelectorAll(".chip").forEach((other) => {
          other.setAttribute("aria-pressed", other === chip ? "true" : "false");
        });
        paint();
      });
    });

    paintSummary();
    paint();
  </script>
</body>
</html>
